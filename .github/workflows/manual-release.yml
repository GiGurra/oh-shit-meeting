name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version increment type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        # windows disabled: Fyne/GL dependencies don't build on Windows CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libgl1-mesa-dev xorg-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true

      - name: Run tests
        run: go test ./...

  version:
    name: Generate Version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Split the version
          IFS='.' read -r major minor patch <<< "${LATEST_TAG/v/}"

          # Calculate new version based on input
          if [[ "${{ github.event.inputs.version_type }}" == "major" ]]; then
            NEW_VERSION="v$((major+1)).0.0"
          elif [[ "${{ github.event.inputs.version_type }}" == "minor" ]]; then
            NEW_VERSION="v$major.$((minor+1)).0"
          else
            NEW_VERSION="v$major.$minor.$((patch+1))"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Creating new version: $NEW_VERSION"

      - name: Push Tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin ${{ steps.version.outputs.new_version }}

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          # windows disabled: Fyne/GL dependencies don't build on Windows CI
          # - os: windows-latest
          #   goos: windows
          #   goarch: amd64
          # - os: windows-11-arm
          #   goos: windows
          #   goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libgl1-mesa-dev xorg-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --single-target --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create archives
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            chmod +x "$dir"oh-shit-meeting*
            tar -czvf "${name}.tar.gz" "$dir"
          done
          sha256sum *.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.new_version }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: [version, release]
    steps:
      - name: Check for the tap deploy key
        id: key
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_KEY" ]; then
            echo 'Homebrew deploy key is absent; skipping tap update.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap
        if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: GiGurra/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update formula
        if: steps.key.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          set -eu
          tap/scripts/update-oh-shit-meeting.sh "$VERSION"
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C tap add Formula/oh-shit-meeting.rb
          if ! git -C tap diff --cached --quiet; then
            git -C tap commit -m "oh-shit-meeting $VERSION"
            git -C tap push
          fi
